{% extends 'base.html' %}

{% block content %}
        <!-- Two Featured Cards Grid -->
        <section class="mt-8 grid grid-cols-1 gap-6">
            <!-- ক্যাটাগরি অবজেক্টের নাম দেখানোর জন্য .name যোগ করা হয়েছে -->
            <h3>Category: {{ category.name }}</h3>

            {% if posts %}
                {% for post in posts %}
                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                    <h2 class="font-serif text-2xl font-bold text-gray-900 mb-1">
                        <a href="#">{{ post.title }}</a>
                    </h2>
                    
                    <div class="text-xs text-gray-400 mb-3">
                        <!-- আপনার মডেলের ফিল্ড অনুযায়ী created_on বা created_at দিন -->
                        {{ post.created_on }} | {{ post.author }}
                    </div>
                    <p class="text-gray-600 text-sm leading-relaxed mb-4">
                        {{ post.short_description }}
                    </p>
                </div>
                {% endfor %}
            {% else %}
                <p>No posts found in this category.</p>
            {% endif %}

        </section>
{% endblock %}
